<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduPlan AI — Lesson Plan & Quiz Generator</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f6f9; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .card { border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); border: none; }
        .btn-primary { background-color: #0d6efd; border: none; font-weight: 600; }
        .output-box { background-color: #ffffff; border: 1px solid #dee2e6; border-radius: 8px; white-space: pre-wrap; font-family: monospace; font-size: 0.95rem; }
    </style>
</head>
<body class="py-5">
    <div class="container" style="max-width: 750px;">
        <div class="card p-4 p-md-5">
            <h2 class="text-center fw-bold mb-1">📚 EduPlan AI</h2>
            <p class="text-center text-muted mb-4">Lesson Plan & Quiz Generator for Teachers</p>
            
            <div class="mb-3">
                <label class="form-label fw-semibold">Google Gemini API Key</label>
                <input type="password" id="apiKey" class="form-control" placeholder="AIzaSy...">
            </div>
            
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label fw-semibold">Subject</label>
                    <input type="text" id="subject" class="form-control" placeholder="e.g. English, Math">
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label fw-semibold">Topic</label>
                    <input type="text" id="topic" class="form-control" placeholder="e.g. Nouns, Fractions">
                </div>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label fw-semibold">Grade Level</label>
                    <select id="grade" class="form-select">
                        <option>Grade 1</option><option>Grade 2</option>
                        <option>Grade 3</option><option>Grade 4</option>
                        <option>Grade 5</option><option>Grade 6</option>
                        <option>Grade 7</option><option>Grade 8</option>
                    </select>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label fw-semibold">Duration (Minutes)</label>
                    <input type="number" id="duration" class="form-control" value="40">
                </div>
            </div>

            <button onclick="generatePlan()" class="btn btn-primary w-100 py-2 mt-3" id="genBtn">✨ Generate Lesson Plan & Quiz</button>

            <div id="output" class="mt-4 p-3 output-box d-none"></div>
        </div>
    </div>

    <script>
        async function generatePlan() {
            const apiKey = document.getElementById('apiKey').value.trim();
            const subject = document.getElementById('subject').value.trim();
            const topic = document.getElementById('topic').value.trim();
            const grade = document.getElementById('grade').value;
            const duration = document.getElementById('duration').value;
            const output = document.getElementById('output');
            const genBtn = document.getElementById('genBtn');

            if (!apiKey || !subject || !topic) {
                alert("براہ کرم API Key، Subject اور Topic تمام خانے پر کریں۔");
                return;
            }

            genBtn.innerText = "Generating... Please wait";
            genBtn.disabled = true;
            output.classList.add('d-none');

            const prompt = `Create a detailed and structured lesson plan along with a 5-question quiz with answers for:
Subject: ${subject}
Topic: ${topic}
Grade: ${grade}
Duration: ${duration} minutes.`;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: prompt }] }]
                    })
                });

                const data = await response.json();
                
                if (data.candidates && data.candidates[0].content.parts[0].text) {
                    output.innerText = data.candidates[0].content.parts[0].text;
                    output.classList.remove('d-none');
                } else if (data.error) {
                    alert("Error: " + data.error.message);
                } else {
                    alert("ایپلی کیشن سے کوئی جواب موصول نہیں ہوا۔");
                }
            } catch (err) {
                alert("کنکشن کی خرابی: " + err.message);
            } finally {
                genBtn.innerText = "✨ Generate Lesson Plan & Quiz";
                genBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
